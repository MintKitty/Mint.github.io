<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Portfolio Furry</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      background: 
        linear-gradient(135deg, #0c0c0c 0%, #1a0f2e 30%, #2a1b3d 60%, #1a0f2e 100%),
        radial-gradient(circle at 20% 80%, rgba(74,144,226,0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(255,107,157,0.1) 0%, transparent 50%),
        radial-gradient(4px 4px at 30px 60px, #4a90e2, transparent),
        radial-gradient(3px 3px at 80px 120px, #ff6b9d, transparent),
        radial-gradient(2px 2px at 140px 80px, #00d4ff, transparent);
      background-size: 100% 100%, 100% 100%, 100% 100%, 200px 150px, 200px 150px, 200px 150px;
      background-repeat: no-repeat, no-repeat, no-repeat, repeat, repeat, repeat;
      animation: bgFloat 20s ease-in-out infinite;
      color: #f0f0f0;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    @keyframes bgFloat {
      0%, 100% { 
        background-position: 0% 50%, 0% 50%, 0% 50%, 0px 0px, 200px 0px, 0px 150px;
      }
      33% { 
        background-position: 10% 60%, 10% 40%, 10% 60%, 100px 50px, 300px 100px, 100px 200px;
      }
      66% { 
        background-position: 20% 40%, 20% 60%, 20% 40%, 200px 100px, 100px 200px, 200px 50px;
      }
    }

    /* HEADER */
    header {
      text-align: center;
      padding: 40px 20px;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(74,144,226,0.3);
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(2em, 5vw, 3em);
      font-weight: 800;
      background: linear-gradient(45deg, #ff6b9d, #4a90e2, #00d4ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
    }

    /* UPLOAD ZONE */
    .upload-zone {
      max-width: 900px;
      margin: 0 auto 30px;
      padding: 30px;
      background: rgba(26, 26, 44, 0.95);
      backdrop-filter: blur(25px);
      border-radius: 25px;
      border: 2px solid rgba(74, 144, 226, 0.4);
      box-shadow: 0 25px 50px rgba(0,0,0,0.6);
    }

    .upload-form {
      display: grid;
      grid-template-columns: 1fr 1fr 150px auto;
      gap: 15px;
      align-items: end;
    }

    .file-input-wrapper {
      position: relative;
      grid-column: 1;
    }

    .file-input-custom {
      padding: 14px 20px;
      background: linear-gradient(135deg, rgba(74,144,226,0.25), rgba(255,107,157,0.25));
      border: 2px solid rgba(74, 144, 226, 0.5);
      border-radius: 15px;
      color: #f0f0f0;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(15px);
      text-align: center;
      font-weight: 500;
      position: relative;
      z-index: 1;
    }

    .file-input-custom:hover {
      background: linear-gradient(135deg, rgba(74,144,226,0.45), rgba(255,107,157,0.45));
      border-color: #4a90e2;
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(74,144,226,0.3);
    }

    .file-input-custom.has-file {
      background: linear-gradient(135deg, #4a90e2, #357abd);
      color: white;
      border-color: #4a90e2;
    }

    #imageInput {
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      z-index: 2;
    }

    input[type="text"], select, textarea {
      padding: 14px 18px;
      border: 2px solid rgba(74, 144, 226, 0.4);
      background: rgba(15, 15, 30, 0.95);
      color: #f0f0f0;
      border-radius: 15px;
      font-size: 14px;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    input[type="text"]:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #4a90e2;
      box-shadow: 0 0 20px rgba(74, 144, 226, 0.4);
      transform: translateY(-2px);
    }

    textarea {
      grid-column: 1 / -1;
      resize: vertical;
      min-height: 90px;
    }

    button {
      padding: 14px 24px;
      background: linear-gradient(135deg, rgba(74,144,226,0.25), rgba(255,107,157,0.25));
      border: 2px solid rgba(74, 144, 226, 0.5);
      color: #f0f0f0;
      font-weight: 600;
      font-size: 14px;
      border-radius: 15px;
      cursor: pointer;
      flex-shrink: 0;
      backdrop-filter: blur(15px);
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: left 0.5s;
    }

    button:hover {
      background: linear-gradient(135deg, rgba(74,144,226,0.5), rgba(255,107,157,0.5));
      border-color: #4a90e2;
      color: white;
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(74,144,226,0.4);
    }

    button:hover::before {
      left: 100%;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }

    .tabs {
      max-width: 900px;
      margin: 0 auto 20px;
      padding: 20px;
      background: rgba(20, 20, 40, 0.9);
      backdrop-filter: blur(20px);
      border-radius: 25px;
      border: 2px solid rgba(74, 144, 226, 0.3);
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: nowrap;
      overflow-x: auto;
      box-shadow: 0 15px 40px rgba(0,0,0,0.5);
    }

    .tab {
      padding: 12px 20px;
      background: rgba(51, 51, 77, 0.9);
      border: 2px solid rgba(74, 144, 226, 0.4);
      color: #f0f0f0;
      cursor: pointer;
      border-radius: 25px;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
      backdrop-filter: blur(15px);
      transition: all 0.4s ease;
    }

    .tab.active, .tab:hover {
      background: linear-gradient(135deg, #4a90e2, #357abd);
      border-color: #4a90e2;
      color: white;
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(74,144,226,0.4);
    }

    .gallery {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 30px;
      justify-content: center;
    }

    .gallery-item {
      position: relative;
      border-radius: 25px;
      overflow: hidden;
      background: rgba(26, 26, 44, 0.95);
      border: 2px solid rgba(74, 144, 226, 0.3);
      box-shadow: 0 20px 50px rgba(0,0,0,0.7);
      cursor: pointer;
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .gallery-item.hidden { display: none !important; }

    .gallery-item:hover {
      transform: translateY(-15px) scale(1.02);
      box-shadow: 0 35px 70px rgba(74,144,226,0.4);
      border-color: #4a90e2;
    }

    .gallery-item img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .category {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 10px 16px;
      background: linear-gradient(135deg, #ff6b9d, #4a90e2);
      color: white;
      font-size: 13px;
      font-weight: 700;
      border-radius: 25px;
      backdrop-filter: blur(15px);
      box-shadow: 0 8px 25px rgba(74,144,226,0.4);
      z-index: 3;
    }

    .desc {
      padding: 25px 20px 50px 20px;
      text-align: center;
      font-size: 15px;
      font-weight: 500;
      z-index: 3;
      margin-top: 10px;
    }

    .date-added {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(74,144,226,0.25);
      color: rgba(255,255,255,0.85);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 15px;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(74,144,226,0.4);
      font-weight: 500;
      z-index: 3;
      white-space: nowrap;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.97);
      backdrop-filter: blur(15px);
    }

    .modal-content {
      position: relative;
      max-width: 95vw;
      max-height: 95vh;
      margin: auto;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal img {
      max-width: 100%;
      max-height: 95vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 20px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.9);
    }

    .close-modal {
      position: fixed;
      top: 25px;
      right: 35px;
      color: #f0f0f0;
      font-size: 40px;
      cursor: pointer;
      background: linear-gradient(135deg, rgba(74,144,226,0.3), rgba(255,107,157,0.3));
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1001;
      backdrop-filter: blur(15px);
      border: 2px solid rgba(74,144,226,0.5);
    }

    .upload-progress {
      grid-column: 1 / -1;
      margin-top: 10px;
      text-align: center;
      color: #4a90e2;
      font-weight: 500;
      display: none;
    }

    @media (max-width: 768px) {
      .upload-form { grid-template-columns: 1fr; gap: 15px; }
      .tabs { gap: 8px; padding: 15px; }
      .tab { padding: 10px 14px; font-size: 13px; }
      .gallery { 
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 25px; 
        padding: 30px 15px; 
      }
    }

    @media (max-width: 480px) {
      .gallery { grid-template-columns: 1fr; }
      .tabs { flex-wrap: wrap; justify-content: center; }
      .modal-content { padding: 10px; }
      .desc { padding: 20px 15px 55px 15px; font-size: 14px; }
      .date-added { font-size: 10px; padding: 3px 8px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>✨ Mon Portfolio Furry ✨</h1>
    <p>Ref sheets • Headshots • Animations • PFP • Bannière • Stickers</p>
  </header>

  <section class="upload-zone">
    <div class="upload-form">
      <div class="file-input-wrapper">
        <input type="file" id="imageInput" accept="image/*">
        <div class="file-input-custom" id="fileInputLabel">📁 Choisir une image</div>
      </div>
      
      <input type="text" id="imageTitle" placeholder="Titre">
      <select id="imageCategory">
        <option value="ref-sheet">📋 Ref Sheet</option>
        <option value="headshot">👤 Headshot</option>
        <option value="animation">🎬 Animation</option>
        <option value="pfp">🖼️ PFP</option>
        <option value="banner">📱 Bannière</option>
        <option value="stickers">🎨 Stickers</option>
      </select>
      <textarea id="imageDesc" placeholder="Description (optionnel)"></textarea>
      <button id="addBtn" onclick="addImage()">➕ Ajouter à la galerie</button>
      <div id="uploadProgress" class="upload-progress">⏳ Upload en cours...</div>
    </div>
  </section>

  <section class="tabs">
    <button class="tab active" data-category="all" onclick="filterGallery('all')">🎨 Toutes</button>
    <button class="tab" data-category="ref-sheet" onclick="filterGallery('ref-sheet')">📋 Ref Sheet</button>
    <button class="tab" data-category="headshot" onclick="filterGallery('headshot')">👤 Headshot</button>
    <button class="tab" data-category="animation" onclick="filterGallery('animation')">🎬 Animation</button>
    <button class="tab" data-category="pfp" onclick="filterGallery('pfp')">🖼️ PFP</button>
    <button class="tab" data-category="banner" onclick="filterGallery('banner')">📱 Bannière</button>
    <button class="tab" data-category="stickers" onclick="filterGallery('stickers')">🎨 Stickers</button>
  </section>

  <section id="gallery" class="gallery"></section>

  <div id="imageModal" class="modal">
    <span class="close-modal" onclick="closeModal()">&times;</span>
    <div class="modal-content" id="modalContent"></div>
  </div>

  <script>
    let allImages = [];
    let currentModalIndex = 0;
    let currentFilter = 'all';
    const STORAGE_KEY = 'furryPortfolio2026';

    // ✅ CHARGEMENT AU DEMARRAGE
    function loadImages() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          allImages = JSON.parse(saved);
          console.log('✅ Images chargées:', allImages.length);
        }
      } catch(e) {
        console.error('Erreur chargement:', e);
      }
      renderGallery();
      filterGallery('all');
    }

    // ✅ SAUVEGARDE AUTOMATIQUE
    function saveImages() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(allImages));
        console.log('💾 Sauvegardé:', allImages.length, 'images');
      } catch(e) {
        console.error('Erreur sauvegarde:', e);
        alert('⚠️ Stockage plein ! Supprime quelques images.');
      }
    }

    document.addEventListener('DOMContentLoaded', loadImages);

    document.getElementById('imageInput').addEventListener('change', function() {
      const label = document.getElementById('fileInputLabel');
      if (this.files.length > 0) {
        label.textContent = this.files[0].name;
        label.classList.add('has-file');
      } else {
        label.textContent = '📁 Choisir une image';
        label.classList.remove('has-file');
      }
    });

    async function addImage() {
      const fileInput = document.getElementById('imageInput');
      const titleInput = document.getElementById('imageTitle');
      const categorySelect = document.getElementById('imageCategory');
      const descInput = document.getElementById('imageDesc');
      const addBtn = document.getElementById('addBtn');
      const progress = document.getElementById('uploadProgress');

      if (fileInput.files.length === 0) {
        alert('Veuillez sélectionner une image !');
        return;
      }

      const file = fileInput.files[0];
      
      // Vérif taille (10MB max)
      if (file.size > 10 * 1024 * 1024) {
        alert('❌ Image trop lourde (max 10MB)');
        return;
      }

      // UI Upload
      addBtn.disabled = true;
      progress.style.display = 'block';

      const reader = new FileReader();
      
      reader.onprogress = (e) => {
        if (e.lengthComputable) {
          const percent = Math.round((e.loaded / e.total) * 100);
          progress.textContent = `⏳ Upload ${percent}%...`;
        }
      };

      reader.onload = function(e) {
        const now = new Date();
        const dateString = now.toLocaleDateString('fr-FR', { 
          day: 'numeric', 
          month: 'short', 
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });

        const imageData = {
          id: Date.now(),
          title: titleInput.value || 'Sans titre',
          category: categorySelect.value,
          description: descInput.value || '',
          imageUrl: e.target.result, // Base64 pour localStorage
          dateAdded: dateString,
          size: file.size // Pour debug
        };

        allImages.unshift(imageData);
        saveImages(); // ✅ SAUVEGARDE
        renderGallery();
        filterGallery(currentFilter);

        // Reset form
        setTimeout(() => {
          fileInput.value = '';
          titleInput.value = '';
          descInput.value = '';
          const label = document.getElementById('fileInputLabel');
          label.textContent = '📁 Choisir une image';
          label.classList.remove('has-file');
          categorySelect.selectedIndex = 0;
          addBtn.disabled = false;
          progress.style.display = 'none';
          progress.textContent = '⏳ Upload en cours...';
        }, 1000);
      };

      reader.onerror = () => {
        alert('❌ Erreur lecture image');
        addBtn.disabled = false;
        progress.style.display = 'none';
      };

      reader.readAsDataURL(file);
    }

    function renderGallery() {
      const gallery = document.getElementById('gallery');
      gallery.innerHTML = '';

      allImages.forEach((image, index) => {
        const item = document.createElement('div');
        item.className = 'gallery-item';
        item.onclick = () => openModal(index);
        item.innerHTML = `
          <img src="${image.imageUrl}" alt="${image.title}" loading="lazy">
          <div class="category">${getCategoryEmoji(image.category)}</div>
          <div class="desc">${image.title}</div>
          <div class="date-added">📅 ${image.dateAdded}</div>
        `;
        gallery.appendChild(item);
      });
    }

    function filterGallery(category) {
      currentFilter = category;
      
      document.querySelectorAll('.tab').forEach(tab => {
        tab.classList.toggle('active', tab.dataset.category === category);
      });

      document.querySelectorAll('.gallery-item').forEach((item, index) => {
        const itemCategory = allImages[index]?.category;
        if (category === 'all' || itemCategory === category) {
          item.classList.remove('hidden');
        } else {
          item.classList.add('hidden');
        }
      });
    }

    function getCategoryEmoji(category) {
      const emojis = {
        'ref-sheet': '📋',
        'headshot': '👤',
        'animation': '🎬',
        'pfp': '🖼️',
        'banner': '📱',
        'stickers': '🎨'
      };
      return emojis[category] || '🎨';
    }

    function openModal(index) {
      currentModalIndex = index;
      const modal = document.getElementById('imageModal');
      const modalContent = document.getElementById('modalContent');
      const image = allImages[index];
      
      modalContent.innerHTML = `<img src="${image.imageUrl}" alt="${image.title}">`;
      modal.style.display = 'block';
    }

    function closeModal() {
      document.getElementById('imageModal').style.display = 'none';
    }

    document.getElementById('imageModal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeModal();
    });

    // ✅ NETTOYAGE si localStorage trop plein
    window.addEventListener('storage', () => loadImages());
    window.addEventListener('beforeunload', saveImages);
  </script>
</body>
</html>
