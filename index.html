<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Portfolio :3</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Segoe UI', -apple-system, sans-serif;
      background: linear-gradient(135deg, #0c0c0c 0%, #1a0f2e 30%, #2a1b3d 60%, #1a0f2e 100%),
        radial-gradient(circle at 20% 80%, rgba(74,144,226,0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(255,107,157,0.1) 0%, transparent 50%);
      background-size: 100% 100%, 100% 100%, 100% 100%;
      animation: bgFloat 20s ease-in-out infinite;
      color: #f0f0f0; min-height: 100vh; overflow-x: hidden;
    }
    @keyframes bgFloat { 
      0%,100%{background-position:0%50%,0%50%,0%50%;} 
      50%{background-position:10%40%,10%60%,10%40%;} 
    }
    header { text-align: center; padding: 40px 20px; background: rgba(0,0,0,0.4); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(74,144,226,0.3); margin-bottom: 20px; }
    h1 { font-size: clamp(2em,5vw,3em); font-weight: 800; background: linear-gradient(45deg,#ff6b9d,#4a90e2,#00d4ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 10px; }

    .admin-login { max-width: 400px; margin: 20px auto; padding: 40px; background: rgba(26,26,44,0.95); backdrop-filter: blur(25px); border-radius: 25px; border: 2px solid rgba(74,144,226,0.4); box-shadow: 0 25px 50px rgba(0,0,0,0.6); text-align: center; }
    .admin-login h2 { color: #4a90e2; margin-bottom: 25px; font-size: 24px; }
    .admin-login input { width: 100%; padding: 15px; margin-bottom: 20px; border: 2px solid rgba(74,144,226,0.4); background: rgba(15,15,30,0.95); color: #f0f0f0; border-radius: 15px; font-size: 16px; }
    .admin-login input:focus { outline: none; border-color: #4a90e2; box-shadow: 0 0 20px rgba(74,144,226,0.4); transform: translateY(-2px); }
    .admin-login button { width: 100%; padding: 15px; background: linear-gradient(135deg,#4a90e2,#357abd); border: none; color: white; font-weight: 600; border-radius: 15px; cursor: pointer; font-size: 16px; }
    .admin-login button:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(74,144,226,0.4); }
    #loginError { color: #ff6b9d; margin-top: 10px; font-weight: 500; }

    .upload-zone { max-width: 900px; margin: 0 auto 30px; padding: 30px; background: rgba(26,26,44,0.95); backdrop-filter: blur(25px); border-radius: 25px; border: 2px solid rgba(74,144,226,0.4); box-shadow: 0 25px 50px rgba(0,0,0,0.6); display: none; }
    .upload-form { display: grid; grid-template-columns: 1fr 1fr 150px auto; gap: 15px; align-items: end; }
    .file-input-wrapper { position: relative; grid-column: 1; }
    .file-input-custom { padding: 14px 20px; background: linear-gradient(135deg,rgba(74,144,226,0.25),rgba(255,107,157,0.25)); border: 2px solid rgba(74,144,226,0.5); border-radius: 15px; color: #f0f0f0; font-size: 14px; cursor: pointer; transition: all 0.3s ease; backdrop-filter: blur(15px); text-align: center; font-weight: 500; position: relative; z-index: 1; }
    .file-input-custom:hover { background: linear-gradient(135deg,rgba(74,144,226,0.45),rgba(255,107,157,0.45)); border-color: #4a90e2; transform: translateY(-2px); box-shadow: 0 10px 25px rgba(74,144,226,0.3); }
    .file-input-custom.has-file { background: linear-gradient(135deg,#4a90e2,#357abd); color: white; border-color: #4a90e2; }
    #imageInput { position: absolute; top: 0; left: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; z-index: 2; }
    input[type="text"],select,textarea { padding: 14px 18px; border: 2px solid rgba(74,144,226,0.4); background: rgba(15,15,30,0.95); color: #f0f0f0; border-radius: 15px; font-size: 14px; transition: all 0.3s ease; backdrop-filter: blur(10px); }
    input[type="text"]:focus,select:focus,textarea:focus { outline: none; border-color: #4a90e2; box-shadow: 0 0 20px rgba(74,144,226,0.4); transform: translateY(-2px); }
    textarea { grid-column: 1 / -1; resize: vertical; min-height: 90px; }
    button { padding: 14px 24px; background: linear-gradient(135deg,rgba(74,144,226,0.25),rgba(255,107,157,0.25)); border: 2px solid rgba(74,144,226,0.5); color: #f0f0f0; font-weight: 600; font-size: 14px; border-radius: 15px; cursor: pointer; flex-shrink: 0; backdrop-filter: blur(15px); transition: all 0.3s ease; }
    button:hover { background: linear-gradient(135deg,rgba(74,144,226,0.5),rgba(255,107,157,0.5)); border-color: #4a90e2; color: white; transform: translateY(-3px); box-shadow: 0 15px 35px rgba(74,144,226,0.4); }
    button:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }

    .tabs { max-width: 900px; margin: 0 auto 20px; padding: 20px; background: rgba(20,20,40,0.9); backdrop-filter: blur(20px); border-radius: 25px; border: 2px solid rgba(74,144,226,0.3); display: flex; justify-content: center; gap: 10px; flex-wrap: nowrap; overflow-x: auto; box-shadow: 0 15px 40px rgba(0,0,0,0.5); }
    .tab { padding: 12px 20px; background: rgba(51,51,77,0.9); border: 2px solid rgba(74,144,226,0.4); color: #f0f0f0; cursor: pointer; border-radius: 25px; font-size: 14px; font-weight: 600; white-space: nowrap; flex-shrink: 0; backdrop-filter: blur(15px); transition: all 0.4s ease; }
    .tab.active,.tab:hover { background: linear-gradient(135deg,#4a90e2,#357abd); border-color: #4a90e2; color: white; transform: translateY(-3px); box-shadow: 0 12px 30px rgba(74,144,226,0.4); }

    .gallery { max-width: 1400px; margin: 0 auto; padding: 40px 20px; display: grid; grid-template-columns: repeat(auto-fill,minmax(320px,1fr)); gap: 30px; justify-content: center; }
    .gallery-item { position: relative; border-radius: 25px; overflow: hidden; background: rgba(26,26,44,0.95); border: 2px solid rgba(74,144,226,0.3); box-shadow: 0 20px 50px rgba(0,0,0,0.7); cursor: pointer; transition: all 0.5s cubic-bezier(0.4,0,0.2,1); }
    .gallery-item.hidden { display: none !important; }
    .gallery-item:hover { transform: translateY(-15px) scale(1.02); box-shadow: 0 35px 70px rgba(74,144,226,0.4); border-color: #4a90e2; }
    .gallery-item img { width: 100%; height: 260px; object-fit: cover; object-position: center; display: block; }
    .category { position: absolute; top: 20px; left: 20px; padding: 10px 16px; background: linear-gradient(135deg,#ff6b9d,#4a90e2); color: white; font-size: 13px; font-weight: 700; border-radius: 25px; backdrop-filter: blur(15px); box-shadow: 0 8px 25px rgba(74,144,226,0.4); z-index: 3; }
    .desc { padding: 25px 20px 50px 20px; text-align: center; font-size: 15px; font-weight: 500; z-index: 3; margin-top: 10px; }
    .date-added { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); background: rgba(74,144,226,0.25); color: rgba(255,255,255,0.85); font-size: 11px; padding: 4px 10px; border-radius: 15px; backdrop-filter: blur(12px); border: 1px solid rgba(74,144,226,0.4); font-weight: 500; z-index: 3; white-space: nowrap; }
    .delete-btn { position: absolute; top: 20px; right: 20px; padding: 8px 14px; background: rgba(220,53,69,0.9); border: 2px solid rgba(255,255,255,0.2); border-radius: 20px; color: #fff; font-size: 12px; font-weight: 600; cursor: pointer; z-index: 4; backdrop-filter: blur(10px); transition: all 0.3s ease; }
    .delete-btn:hover { background: rgba(255,0,64,1); transform: translateY(-2px); box-shadow: 0 10px 25px rgba(255,0,64,0.6); }

    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.97); backdrop-filter: blur(15px); }
    .modal-content { position: relative; max-width: 95vw; max-height: 95vh; margin: auto; top: 50%; transform: translateY(-50%); display: flex; align-items: center; justify-content: center; padding: 20px; }
    .modal img { max-width: 100%; max-height: 95vh; width: auto; height: auto; object-fit: contain; border-radius: 20px; box-shadow: 0 30px 80px rgba(0,0,0,0.9); }
    .close-modal { position: fixed; top: 25px; right: 35px; color: #f0f0f0; font-size: 40px; cursor: pointer; background: linear-gradient(135deg,rgba(74,144,226,0.3),rgba(255,107,157,0.3)); width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 1001; backdrop-filter: blur(15px); border: 2px solid rgba(74,144,226,0.5); }

    .upload-progress { grid-column: 1 / -1; margin-top: 10px; text-align: center; color: #4a90e2; font-weight: 500; display: none; }
    .status { text-align: center; padding: 20px; background: rgba(26,26,44,0.8); border-radius: 15px; margin: 20px auto; max-width: 900px; border: 1px solid rgba(74,144,226,0.3); }

    @media (max-width:768px) { .upload-form { grid-template-columns: 1fr; } .tabs { gap: 8px; padding: 15px; } .tab { padding: 10px 14px; font-size: 13px; } .gallery { grid-template-columns: repeat(auto-fill,minmax(300px,1fr)); gap: 25px; padding: 30px 15px; } .admin-login { margin: 10px; padding: 30px 20px; } }
    @media (max-width:480px) { .gallery { grid-template-columns: 1fr; } .tabs { flex-wrap: wrap; justify-content: center; } }
  </style>
</head>
<body>
  <header>
    <h1>✨ Mon Portfolio :3 ✨</h1>
    <p>Ref sheets • Headshots • Animations • PFP • Bannière • Stickers</p>
  </header>

  <div id="adminLogin" class="admin-login">
    <h2>🔐 Mode Admin</h2>
    <input type="password" id="adminPassword" placeholder="Password :p">
    <button onclick="loginAdmin()">Connexion</button>
    <div id="loginError"></div>
  </div>

  <div id="status" class="status" style="display:none;">
    🚀 <strong id="statusText">Chargement...</strong>
  </div>

  <section class="upload-zone" id="uploadZone" style="display:none;">
    <div class="upload-form">
      <div class="file-input-wrapper">
        <input type="file" id="imageInput" accept="image/*">
        <div class="file-input-custom" id="fileInputLabel">📁 Choisir une image</div>
      </div>
      <input type="text" id="imageTitle" placeholder="Titre">
      <select id="imageCategory">
        <option value="ref-sheet">📋 Ref Sheet</option>
        <option value="headshot">👤 Headshot</option>
        <option value="animation">🎬 Animation</option>
        <option value="pfp">🖼️ PFP</option>
        <option value="banner">📱 Bannière</option>
        <option value="stickers">🎨 Stickers</option>
      </select>
      <textarea id="imageDesc" placeholder="Description (optionnel)"></textarea>
      <button id="addBtn">➕ Ajouter à la galerie</button>
      <div id="uploadProgress" class="upload-progress">⏳ Upload...</div>
    </div>
  </section>

  <section class="tabs">
    <button class="tab active" data-category="all" onclick="filterGallery('all')">🎨 Toutes</button>
    <button class="tab" data-category="ref-sheet" onclick="filterGallery('ref-sheet')">📋 Ref Sheet</button>
    <button class="tab" data-category="headshot" onclick="filterGallery('headshot')">👤 Headshot</button>
    <button class="tab" data-category="animation" onclick="filterGallery('animation')">🎬 Animation</button>
    <button class="tab" data-category="pfp" onclick="filterGallery('pfp')">🖼️ PFP</button>
    <button class="tab" data-category="banner" onclick="filterGallery('banner')">📱 Bannière</button>
    <button class="tab" data-category="stickers" onclick="filterGallery('stickers')">🎨 Stickers</button>
  </section>

  <section id="gallery" class="gallery"></section>

  <div id="imageModal" class="modal">
    <span class="close-modal" onclick="closeModal()">&times;</span>
    <div class="modal-content" id="modalContent"></div>
  </div>

  <script>
    let allImages = JSON.parse(localStorage.getItem('portfolioImages') || '[]');
    let currentFilter = 'all';
    let isUploading = false;
    let isAdmin = false;

    // Éléments DOM
    const adminLoginEl = document.getElementById('adminLogin');
    const adminPasswordEl = document.getElementById('adminPassword');
    const loginErrorEl = document.getElementById('loginError');
    const uploadZoneEl = document.getElementById('uploadZone');
    const statusEl = document.getElementById('status');
    const statusTextEl = document.getElementById('statusText');
    const addBtnEl = document.getElementById('addBtn');
    const progressEl = document.getElementById('uploadProgress');

    // ✅ CONNEXION ADMIN
    function loginAdmin() {
      const password = adminPasswordEl.value.trim();
      if (password === "Tim.23072010") {
        isAdmin = true;
        adminLoginEl.style.display = 'none';
        uploadZoneEl.style.display = 'block';
        renderGallery();
        alert('✅ Admin connecté !');
      } else {
        loginErrorEl.textContent = '❌ Mot de passe incorrect';
        loginErrorEl.style.display = 'block';
        adminPasswordEl.value = '';
        setTimeout(() => loginErrorEl.style.display = 'none', 3000);
      }
    }

    // File input
    document.getElementById('imageInput').onchange = function() {
      const label = document.getElementById('fileInputLabel');
      if (this.files[0]) {
        label.textContent = this.files[0].name;
        label.classList.add('has-file');
      } else {
        label.textContent = '📁 Choisir une image';
        label.classList.remove('has-file');
      }
    };

    // Ajout image
    function addImage() {
      if (!isAdmin || isUploading) return alert('Patiente ou connecte-toi admin !');
      
      const fileInput = document.getElementById('imageInput');
      const titleInput = document.getElementById('imageTitle');
      const categorySelect = document.getElementById('imageCategory');
      const descInput = document.getElementById('imageDesc');
      
      if (!fileInput.files[0]) return alert('Choisis une image !');
      
      const file = fileInput.files[0];
      if (file.size > 10*1024*1024) return alert('Image trop lourde (max 10MB)');
      
      isUploading = true;
      addBtnEl.disabled = true;
      addBtnEl.textContent = '⏳ Upload...';
      progressEl.style.display = 'block';
      progressEl.textContent = '📤 Conversion...';

      const reader = new FileReader();
      reader.onload = function(e) {
        const imgData = {
          id: Date.now(),
          title: titleInput.value || 'Sans titre',
          category: categorySelect.value,
          description: descInput.value || '',
          image_url: e.target.result,
          date_added: new Date().toLocaleDateString('fr-FR', {day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}),
          created_at: new Date().toISOString()
        };
        
        allImages.unshift(imgData);
        localStorage.setItem('portfolioImages', JSON.stringify(allImages));
        
        progressEl.textContent = '✅ Ajouté !';
        renderGallery();
        
        setTimeout(() => {
          fileInput.value = ''; titleInput.value = ''; descInput.value = '';
          document.getElementById('fileInputLabel').textContent = '📁 Choisir une image';
          document.getElementById('fileInputLabel').classList.remove('has-file');
          categorySelect.selectedIndex = 0;
          addBtnEl.disabled = false;
          addBtnEl.textContent = '➕ Ajouter à la galerie';
          progressEl.style.display = 'none';
          isUploading = false;
        }, 1500);
      };
      reader.readAsDataURL(file);
    }

    // Rendu galerie
    function renderGallery() {
      const gallery = document.getElementById('gallery');
      gallery.innerHTML = '';
      
      allImages.forEach((image, index) => {
        const item = document.createElement('div');
        item.className = 'gallery-item';
        item.innerHTML = `
          <img src="${image.image_url}" alt="${image.title}" loading="lazy">
          <div class="category">${getCategoryEmoji(image.category)}</div>
          <div class="desc">${image.title}</div>
          <div class="date-added">📅 ${image.date_added}</div>
          ${isAdmin ? `<button class="delete-btn" onclick="deleteImage(${image.id}, event)">🗑️</button>` : ''}
        `;
        
        item.querySelector('img').onclick = (e) => { e.stopPropagation(); openModal(index); };
        gallery.appendChild(item);
      });
      
      filterGallery(currentFilter);
    }

    // Suppression
    function deleteImage(id, event) {
      event.stopPropagation();
      if (!isAdmin) return;
      
      if (confirm(`🗑️ Supprimer "${allImages.find(img => img.id === id)?.title}" ?`)) {
        allImages = allImages.filter(img => img.id !== id);
        localStorage.setItem('portfolioImages', JSON.stringify(allImages));
        renderGallery();
        alert('✅ Image supprimée !');
      }
    }

    // Filtrage
    function filterGallery(category) {
      currentFilter = category;
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.category === category));
      document.querySelectorAll('.gallery-item').forEach((item, index) => {
        const cat = allImages[index]?.category;
        item.classList.toggle('hidden', category !== 'all' && cat !== category);
      });
    }

    // Emoji catégories
    function getCategoryEmoji(category) {
      const emojis = {
        'ref-sheet': '📋', 'headshot': '👤', 'animation': '🎬',
        'pfp': '🖼️', 'banner': '📱', 'stickers': '🎨'
      };
      return emojis[category] || '🎨';
    }

    // Modal
    function openModal(index) {
      const modal = document.getElementById('imageModal');
      const modalContent = document.getElementById('modalContent');
      const image = allImages[index];
      modalContent.innerHTML = `<img src="${image.image_url}" alt="${image.title}">`;
      modal.style.display = 'block';
    }

    function closeModal() {
      document.getElementById('imageModal').style.display = 'none';
    }

    // Événements
    document.getElementById('imageModal').onclick = e => {
      if (e.target.id === 'imageModal') closeModal();
    };
    document.onkeydown = e => { if (e.key === 'Escape') closeModal(); };
    document.getElementById('addBtn').onclick = addImage;
    adminPasswordEl.onkeypress = e => { if (e.key === 'Enter') loginAdmin(); };

    // Initialisation
    renderGallery();
  </script>
</body>
</html>
