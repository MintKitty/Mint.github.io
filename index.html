 <!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Portfolio :3</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #0c0c0c 0%, #1a0f2e 50%, #2a1b3d 100%);
      animation: bgFloat 20s ease-in-out infinite;
      color: #f0f0f0; min-height: 100vh; overflow-x: hidden;
    }
    @keyframes bgFloat { 0%,100%{background-position:0%50%;} 50%{background-position:10%40%;} }
    
    header { text-align: center; padding: 40px 20px; background: rgba(0,0,0,0.4); backdrop-filter: blur(20px); }
    h1 { font-size: clamp(2em,5vw,3em); font-weight: 800; background: linear-gradient(45deg,#ff6b9d,#4a90e2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

    .admin-login { max-width: 400px; margin: 20px auto; padding: 40px; background: rgba(26,26,44,0.95); border-radius: 25px; border: 2px solid rgba(74,144,226,0.4); box-shadow: 0 25px 50px rgba(0,0,0,0.6); text-align: center; }
    .admin-login h2 { color: #4a90e2; margin-bottom: 25px; font-size: 24px; }
    .admin-login input { width: 100%; padding: 15px; margin-bottom: 20px; border: 2px solid rgba(74,144,226,0.4); background: rgba(15,15,30,0.95); color: #f0f0f0; border-radius: 15px; }
    .admin-login input:focus { outline: none; border-color: #4a90e2; box-shadow: 0 0 20px rgba(74,144,226,0.4); }
    .admin-login button { width: 100%; padding: 15px; background: linear-gradient(135deg,#4a90e2,#357abd); border: none; color: white; font-weight: 600; border-radius: 15px; cursor: pointer; }
    #loginError { color: #ff6b9d; margin-top: 10px; font-weight: 500; }

    .upload-zone { max-width: 900px; margin: 20px auto; padding: 30px; background: rgba(26,26,44,0.95); border-radius: 25px; border: 2px solid rgba(74,144,226,0.4); box-shadow: 0 25px 50px rgba(0,0,0,0.6); display: none; }
    .upload-form { display: grid; grid-template-columns: 1fr 1fr auto; gap: 15px; align-items: end; }
    .file-input-wrapper { position: relative; }
    .file-input-custom { padding: 15px; background: linear-gradient(135deg,rgba(74,144,226,0.25),rgba(255,107,157,0.25)); border: 2px solid rgba(74,144,226,0.5); border-radius: 15px; color: #f0f0f0; cursor: pointer; text-align: center; }
    .file-input-custom.has-file { background: linear-gradient(135deg,#4a90e2,#357abd); color: white; }
    #imageInput { position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
    input[type="text"], select, textarea { padding: 15px; border: 2px solid rgba(74,144,226,0.4); background: rgba(15,15,30,0.95); color: #f0f0f0; border-radius: 15px; }
    input:focus, select:focus, textarea:focus { border-color: #4a90e2; outline: none; }
    textarea { grid-column: 1 / -1; resize: vertical; min-height: 90px; }
    button { padding: 15px 24px; background: linear-gradient(135deg,rgba(74,144,226,0.25),rgba(255,107,157,0.25)); border: 2px solid rgba(74,144,226,0.5); color: #f0f0f0; border-radius: 15px; cursor: pointer; }
    button:hover { background: linear-gradient(135deg,#4a90e2,#357abd); color: white; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .tabs { max-width: 900px; margin: 0 auto 20px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .tab { padding: 12px 20px; background: rgba(51,51,77,0.9); border: 2px solid rgba(74,144,226,0.4); color: #f0f0f0; cursor: pointer; border-radius: 25px; font-weight: 600; }
    .tab.active { background: linear-gradient(135deg,#4a90e2,#357abd); color: white; }

    .gallery { max-width: 1400px; margin: 0 auto; padding: 40px 20px; display: grid; grid-template-columns: repeat(auto-fill,minmax(320px,1fr)); gap: 30px; }
    .gallery-item { 
      position: relative; 
      border-radius: 25px; 
      overflow: hidden; 
      background: rgba(26,26,44,0.95); 
      border: 2px solid rgba(74,144,226,0.3); 
      box-shadow: 0 20px 50px rgba(0,0,0,0.7); 
      cursor: pointer; 
      transition: all 0.3s ease; 
      height: 400px; /* Hauteur fixe pour aligner */
    }
    .gallery-item:hover { transform: translateY(-10px); border-color: #4a90e2; }
    .gallery-item img { 
      width: 100%; 
      height: 260px; 
      object-fit: cover; 
      display: block;
      transition: transform 0.3s ease;
    }
    .gallery-item img:hover { transform: scale(1.05); }
    
    /* ✅ CATÉGORIES CORRIGÉES */
    .category { 
      position: absolute; 
      top: 15px; 
      left: 15px; 
      padding: 8px 16px; 
      background: linear-gradient(135deg,#ff6b9d,#4a90e2); 
      color: white; 
      border-radius: 20px; 
      font-size: 13px; 
      font-weight: 700; 
      z-index: 3;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    
    .desc { 
      padding: 20px 15px 60px 15px; 
      text-align: center; 
      font-weight: 500; 
      font-size: 16px;
    }
    
    .date-added { 
      position: absolute; 
      bottom: 10px; 
      left: 50%; 
      transform: translateX(-50%); 
      background: rgba(74,144,226,0.25); 
      color: rgba(255,255,255,0.9); 
      padding: 6px 12px; 
      border-radius: 15px; 
      font-size: 12px; 
      font-weight: 500;
      z-index: 3;
    }
    
    .delete-btn { 
      position: absolute; 
      top: 15px; 
      right: 15px; 
      padding: 8px 12px; 
      background: rgba(220,53,69,0.9); 
      border: none; 
      border-radius: 20px; 
      color: white; 
      cursor: pointer; 
      font-weight: 600;
      z-index: 4;
    }
    .delete-btn:hover { background: #dc3545; }

    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); }
    .modal-content { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); max-width: 90%; max-height: 90%; }
    .modal img { max-width: 100%; max-height: 100%; border-radius: 20px; }
    .close-modal { position: fixed; top: 20px; right: 30px; color: white; font-size: 40px; cursor: pointer; }

    .upload-progress { grid-column: 1 / -1; margin-top: 10px; text-align: center; color: #4a90e2; font-weight: 500; display: none; }

    @media (max-width:768px) { 
      .upload-form { grid-template-columns: 1fr; } 
      .tabs { flex-direction: column; align-items: center; } 
      .gallery { grid-template-columns: 1fr; gap: 20px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>✨ Mon Portfolio :3 ✨</h1>
    <p>Ref sheets • Headshots • Animations • PFP • Bannière • Stickers</p>
  </header>

  <div id="adminLogin" class="admin-login">
    <h2>🔐 Mode Admin</h2>
    <input type="password" id="adminPassword" placeholder="Password :p">
    <button onclick="loginAdmin()">Connexion</button>
    <div id="loginError"></div>
  </div>

  <section class="upload-zone" id="uploadZone">
    <div class="upload-form">
      <div class="file-input-wrapper">
        <input type="file" id="imageInput" accept="image/*">
        <div class="file-input-custom" id="fileInputLabel">📁 Choisir une image</div>
      </div>
      <input type="text" id="imageTitle" placeholder="Titre">
      <select id="imageCategory">
        <option value="ref-sheet">📋 Ref Sheet</option>
        <option value="headshot">👤 Headshot</option>
        <option value="animation">🎬 Animation</option>
        <option value="pfp">🖼️ PFP</option>
        <option value="banner">📱 Bannière</option>
        <option value="stickers">🎨 Stickers</option>
      </select>
      <textarea id="imageDesc" placeholder="Description (optionnel)"></textarea>
      <button id="addBtn">➕ Ajouter à la galerie</button>
      <div id="uploadProgress" class="upload-progress">⏳ Upload...</div>
    </div>
  </section>

  <section class="tabs">
    <button class="tab active" data-category="all" onclick="filterGallery('all')">🎨 Toutes</button>
    <button class="tab" data-category="ref-sheet" onclick="filterGallery('ref-sheet')">📋 Ref Sheet</button>
    <button class="tab" data-category="headshot" onclick="filterGallery('headshot')">👤 Headshot</button>
    <button class="tab" data-category="animation" onclick="filterGallery('animation')">🎬 Animation</button>
    <button class="tab" data-category="pfp" onclick="filterGallery('pfp')">🖼️ PFP</button>
    <button class="tab" data-category="banner" onclick="filterGallery('banner')">📱 Bannière</button>
    <button class="tab" data-category="stickers" onclick="filterGallery('stickers')">🎨 Stickers</button>
  </section>

  <section id="gallery" class="gallery"></section>

  <div id="imageModal" class="modal">
    <span class="close-modal" onclick="closeModal()">&times;</span>
    <div class="modal-content" id="modalContent"></div>
  </div>

  <script>
    let allImages = JSON.parse(localStorage.getItem('portfolioImages') || '[]');
    let currentFilter = 'all';
    let isUploading = false;
    let isAdmin = false;

    function loginAdmin() {
      const password = document.getElementById('adminPassword').value.trim();
      if (password === "Tim.23072010") {
        isAdmin = true;
        document.getElementById('adminLogin').style.display = 'none';
        document.getElementById('uploadZone').style.display = 'block';
        renderGallery();
        alert('✅ Admin connecté !');
      } else {
        document.getElementById('loginError').textContent = '❌ Mot de passe incorrect';
        setTimeout(() => document.getElementById('loginError').textContent = '', 3000);
      }
    }

    document.getElementById('imageInput').onchange = function() {
      const label = document.getElementById('fileInputLabel');
      if (this.files[0]) {
        label.textContent = this.files[0].name;
        label.classList.add('has-file');
      } else {
        label.textContent = '📁 Choisir une image';
        label.classList.remove('has-file');
      }
    };

    function addImage() {
      if (!isAdmin || isUploading) return alert('Patiente !');
      
      const fileInput = document.getElementById('imageInput');
      const titleInput = document.getElementById('imageTitle');
      const categorySelect = document.getElementById('imageCategory');
      
      if (!fileInput.files[0]) return alert('Choisis une image !');
      if (fileInput.files[0].size > 5*1024*1024) return alert('Max 5MB');

      isUploading = true;
      const addBtnEl = document.getElementById('addBtn');
      const progressEl = document.getElementById('uploadProgress');
      
      addBtnEl.disabled = true;
      addBtnEl.textContent = '⏳ Upload...';
      progressEl.style.display = 'block';
      progressEl.textContent = '📤 Conversion...';

      const reader = new FileReader();
      reader.onload = function(e) {
        const imgData = {
          id: Date.now(),
          title: titleInput.value || 'Sans titre',
          category: categorySelect.value,
          image_url: e.target.result,
          date_added: new Date().toLocaleDateString('fr-FR', { 
            day: 'numeric', month: 'short', year: 'numeric', 
            hour: '2-digit', minute: '2-digit' 
          })
        };
        
        allImages.unshift(imgData);
        localStorage.setItem('portfolioImages', JSON.stringify(allImages));
        
        progressEl.textContent = '✅ Ajoutée !';
        renderGallery();
        
        setTimeout(() => {
          fileInput.value = ''; titleInput.value = ''; 
          document.getElementById('fileInputLabel').textContent = '📁 Choisir une image';
          document.getElementById('fileInputLabel').classList.remove('has-file');
          categorySelect.selectedIndex = 0;
          addBtnEl.disabled = false;
          addBtnEl.textContent = '➕ Ajouter à la galerie';
          progressEl.style.display = 'none';
          isUploading = false;
        }, 1500);
      };
      reader.readAsDataURL(fileInput.files[0]);
    }

    function renderGallery() {
      const gallery = document.getElementById('gallery');
      gallery.innerHTML = '';
      
      allImages.forEach((image, index) => {
        const item = document.createElement('div');
        item.className = 'gallery-item';
        item.innerHTML = `
          <img src="${image.image_url}" alt="${image.title}" loading="lazy">
          <div class="category">${getCategoryEmoji(image.category)}</div>
          <div class="desc">${image.title}</div>
          <div class="date-added">📅 ${image.date_added}</div>
          ${isAdmin ? `<button class="delete-btn" onclick="deleteImage(${image.id}, event)">🗑️</button>` : ''}
        `;
        
        item.querySelector('img').onclick = (e) => { e.stopPropagation(); openModal(index); };
        gallery.appendChild(item);
      });
      
      filterGallery(currentFilter);
    }

    function deleteImage(id, event) {
      event.stopPropagation();
      if (confirm(`🗑️ Supprimer "${allImages.find(img => img.id === id)?.title}" ?`)) {
        allImages = allImages.filter(img => img.id !== id);
        localStorage.setItem('portfolioImages', JSON.stringify(allImages));
        renderGallery();
        alert('✅ Supprimée !');
      }
    }

    function filterGallery(category) {
      currentFilter = category;
      document.querySelectorAll('.tab').forEach(t => 
        t.classList.toggle('active', t.dataset.category === category)
      );
      document.querySelectorAll('.gallery-item').forEach((item, index) => {
        const cat = allImages[index]?.category;
        item.style.display = (category === 'all' || cat === category) ? 'block' : 'none';
      });
    }

    function getCategoryEmoji(category) {
      const emojis = {
        'ref-sheet': '📋', 'headshot': '👤', 'animation': '🎬',
        'pfp': '🖼️', 'banner': '📱', 'stickers': '🎨'
      };
      return emojis[category] || '🎨';
    }

    function openModal(index) {
      const modal = document.getElementById('imageModal');
      const modalContent = document.getElementById('modalContent');
      const image = allImages[index];
      modalContent.innerHTML = `<img src="${image.image_url}" alt="${image.title}">`;
      modal.style.display = 'block';
    }

    function closeModal() {
      document.getElementById('imageModal').style.display = 'none';
    }

    document.getElementById('imageModal').onclick = e => {
      if (e.target.id === 'imageModal') closeModal();
    };
    document.onkeydown = e => { if (e.key === 'Escape') closeModal(); };
    document.getElementById('addBtn').onclick = addImage;
    document.getElementById('adminPassword').onkeypress = e => { 
      if (e.key === 'Enter') loginAdmin(); 
    };

    renderGallery();
  </script>
</body>
</html>
